[project]
name = "plant-disease-detector"
version = "0.1.0"
description = "A simple plant disease detector: a scikit-learn neural network trained on leaf images, served as a Streamlit app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
